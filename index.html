<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบสารบรรณดิจิทัล</title><style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#203047;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#163d73;color:white}button.secondary{background:#e7eef8;color:#173a67}button.danger{background:#b42f46}button:disabled{opacity:.5}input,select,textarea{border:1px solid #cdd8e7;border-radius:8px;padding:10px;width:100%;background:white}textarea{min-height:90px}label{font-size:13px;color:#47566a;display:block}label>*{margin-top:5px}.layout{display:flex;min-height:100vh}.side{width:250px;background:#102d53;color:white;padding:22px 12px;flex-shrink:0}.brand{font-size:18px;font-weight:800;padding:12px}.nav{display:block;width:100%;text-align:left;background:transparent;margin:3px 0}.nav.active,.nav:hover{background:#285387}.main{flex:1;min-width:0}.top{background:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 1px 6px #dde5ef}.content{padding:24px;max-width:1600px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e1e8f2;border-radius:14px;padding:18px;box-shadow:0 2px 10px #d9e4f244}.card strong{font-size:28px;color:#153d72}.panel{margin-top:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{max-width:240px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:11px;border-bottom:1px solid #e8edf5;text-align:left;white-space:nowrap}th{background:#f3f7fc;cursor:pointer}td button{margin:2px;padding:6px 9px}.badge{border-radius:20px;padding:4px 9px;background:#e7eef9;color:#17416f}.badge[data-status="เกินกำหนด"],.badge[data-status="ยกเลิก"]{background:#ffe2e5;color:#a51c35}.badge[data-status="เสร็จสิ้น"],.badge[data-status="ส่งแล้ว"]{background:#d9f6e6;color:#14683c}.badge[data-status="รอเสนอ"],.badge[data-status="รอสั่งการ"],.badge[data-status="รอลงนาม"]{background:#fff0ca;color:#895800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.overlay{position:fixed;inset:0;background:#14253b99;display:grid;place-items:center;z-index:5;padding:14px}.modal{background:white;border-radius:14px;padding:22px;width:min(850px,100%);max-height:94vh;overflow:auto}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#173d6d;color:white;padding:15px;border-radius:10px;z-index:10}.login{max-width:430px;margin:12vh auto}.muted{color:#65758c;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pagination{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:14px}.bars{display:flex;align-items:end;gap:8px;height:180px;overflow:auto}.bar{min-width:35px;background:#3b79c6;border-radius:5px 5px 0 0}.barlabel{font-size:10px;text-align:center}.mobilemenu{display:none}@media(max-width:800px){.side{position:fixed;inset:0 auto 0 0;z-index:4;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.mobilemenu{display:block}.content{padding:12px}.top{padding:12px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div id="app"></div><div id="modal" class="overlay hidden"><div class="modal"><div class="toolbar"><h3 id="modalTitle" style="flex:1"></h3><button class="secondary" onclick="closeModal()">ปิด</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div><script>
'use strict';const API_URL='https://script.google.com/macros/s/AKfycbyGlu5eZJPsVn532lmW-Obs7FY_wl-IYkA0O00AyKLmtJTGiHdXIu7r3e1yqT75Dlrg2g/exec';const state={token:sessionStorage.getItem('ddms_token')||'',user:null,page:'dashboard',rows:[],sort:'CreatedAt',desc:true,offset:0,limit:15,filter:'',settings:{},lookups:{},dashboard:null};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=m=>{const e=$('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500)};const date=v=>v?String(v).slice(0,10):'';const safeUrl=u=>/^https:\/\/(drive|docs)\.google\.com\//.test(u||'')?u:'';
async function api(action,data={}){if(API_URL.startsWith('PASTE_'))throw Error('กรุณากำหนด API_URL ใน index.html');const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:state.token,data})});const x=await r.json();if(!x.success)throw Error(x.message||'ไม่สามารถดำเนินการได้');return x.data}async function run(fn){try{return await fn()}catch(e){toast(e.message);if(/เซสชัน|เข้าสู่ระบบใหม่/.test(e.message))logout();return null}}function logout(){state.token='';state.user=null;sessionStorage.removeItem('ddms_token');render()}
function render(){if(!state.user){$('app').innerHTML=`<div class="login panel"><h2>ระบบสารบรรณดิจิทัล</h2><p>ภาควิชาเทคโนโลยีและสื่อสารการศึกษา</p><label>อีเมลบัญชี Google ที่ได้รับอนุญาต<input id="email" type="email"></label><label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password"></label><div class="actions"><button onclick="login()">เข้าสู่ระบบ</button></div><p class="muted">ผู้ดูแลระบบสามารถตั้งรหัสผ่านใหม่ใน Google Sheets แท็บ Users คอลัมน์ PasswordReset ระบบจะเข้ารหัสหลังเข้าสู่ระบบสำเร็จ</p></div>`;return}const nav=[['dashboard','🏠 ภาพรวม'],['incoming','📥 หนังสือรับ'],['outgoing','📤 หนังสือส่ง'],['workflow','📋 เสนอ / สั่งการ'],['editor','📄 จัดทำเอกสาร'],['folders','🗂️ ทะเบียน / แฟ้ม'],['search','🔎 ค้นหา'],['reports','📊 รายงาน'],['settings','⚙️ ตั้งค่า']];$('app').innerHTML=`<div class="layout"><aside class="side" id="side"><div class="brand">ระบบสารบรรณดิจิทัล</div>${nav.map(([k,v])=>`<button class="nav ${state.page===k?'active':''}" onclick="navigate('${k}')">${v}</button>`).join('')}</aside><div class="main"><header class="top"><button class="mobilemenu" onclick="$('side').classList.toggle('open')">☰</button><b>สำนักงานดิจิทัล · มหาวิทยาลัยมหาสารคาม</b><span>${esc(state.user.Name)} · ${esc(state.user.Role)} <button class="secondary" onclick="logout()">ออกจากระบบ</button></span></header><main class="content" id="view"></main></div></div>`;loadPage()}
async function login(){await run(async()=>{const email=$('email').value.trim();const x=await api('login',{email,password:$('password').value});state.token=x.token;state.user=x.user;sessionStorage.setItem('ddms_token',x.token);render()})}async function boot(){if(!state.token)return render();await run(async()=>{state.user=await api('getCurrentUser');render()});if(!state.user)render()};function navigate(p){state.page=p;state.offset=0;state.filter='';render()}
const titles={incoming:'หนังสือรับ',outgoing:'หนังสือส่ง',workflow:'เสนอ / สั่งการ',folders:'ทะเบียน / แฟ้ม',search:'ค้นหาเอกสาร'};const status=['รอดำเนินการ','กำลังดำเนินการ','รอเสนอ','รอสั่งการ','มอบหมายแล้ว','รอลงนาม','ส่งแล้ว','เสร็จสิ้น','เกินกำหนด','ยกเลิก','จัดเก็บถาวร'];const option=(values,value='')=>values.map(v=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(v)}</option>`).join('');function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
async function loadPage(){const v=$('view');if(!v)return;v.innerHTML='<div class="panel">กำลังโหลดข้อมูล...</div>';await run(async()=>{if(state.page==='dashboard'){const d=await api('getDashboard');state.dashboard=d;v.innerHTML=`<h2>ภาพรวมระบบ</h2><div class="cards">${Object.entries(d.counts).map(([k,n])=>`<div class="card"><div>${esc(k)}</div><strong>${n}</strong></div>`).join('')}</div><div class="grid"><div class="panel"><h3>หนังสือรายเดือน</h3>${bars(d.monthly)}</div><div class="panel"><h3>สถานะเอกสาร</h3>${Object.entries(d.statuses).map(([k,n])=>`<p>${esc(k)} <b>${n}</b></p>`).join('')}</div><div class="panel wide"><h3>ตามหน่วยงาน</h3>${Object.entries(d.departments).map(([k,n])=>`<p>${esc(k)}: ${n}</p>`).join('')}</div></div>`;return}if(state.page==='settings'){await settingsPage();return}if(state.page==='editor'){editorPage();return}if(state.page==='reports'){await reportsPage();return}await listPage()})}function bars(data){const max=Math.max(1,...data.map(x=>x.incoming+x.outgoing));return `<div class="bars">${data.map(x=>`<div><div style="display:flex;align-items:end;height:150px;gap:2px"><div class="bar" title="รับ ${x.incoming}" style="height:${x.incoming/max*145}px"></div><div class="bar" title="ส่ง ${x.outgoing}" style="height:${x.outgoing/max*145}px;background:#5db9b0"></div></div><div class="barlabel">${esc(x.month)}</div></div>`).join('')}</div><p class="muted">สีน้ำเงิน: รับ · สีเขียว: ส่ง</p>`}
async function listPage(){const p=state.page;let rows;if(p==='incoming')rows=await api('getIncomingBooks');else if(p==='outgoing')rows=await api('getOutgoingBooks');else if(p==='workflow')rows=await api('getWorkflowQueue');else if(p==='folders')rows=await api('getFolders');else rows=await api('searchDocuments',{});state.rows=rows;drawTable()}function drawTable(){const p=state.page;const rows=state.rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(state.filter.toLowerCase())));rows.sort((a,b)=>String(a[state.sort]??'').localeCompare(String(b[state.sort]??''),'th',{numeric:true})*(state.desc?-1:1));const page=rows.slice(state.offset,state.offset+state.limit);const cols=p==='folders'?['Name','Year','Department','Category','Type']:['RegisterNo','BookNo','Subject','FromDepartment','ToDepartment','Responsible','Deadline','Status'];$('view').innerHTML=`<h2>${titles[p]}</h2><div class="panel"><div class="toolbar"><input placeholder="ค้นหาในรายการ" value="${esc(state.filter)}" oninput="state.filter=this.value;state.offset=0;drawTable()"><select onchange="state.filter=this.value;state.offset=0;drawTable()"><option value="">ทุกสถานะ</option>${option(status)}</select>${['incoming','outgoing','folders'].includes(p)?`<button onclick="formRecord()">+ เพิ่มรายการ</button>`:''}<button class="secondary" onclick="printTable()">พิมพ์</button><button class="secondary" onclick="exportCsv()">CSV</button></div><div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th onclick="sortBy('${c}')">${esc(c)} ↕</th>`).join('')}<th>จัดการ</th></tr></thead><tbody>${page.map(r=>`<tr>${cols.map(c=>`<td>${c==='Status'?`<span class="badge" data-status="${esc(r[c])}">${esc(r[c])}</span>`:esc(r[c])}</td>`).join('')}<td><button class="secondary" onclick="viewRecord('${esc(r.ID)}')">ดู</button>${p!=='search'?`<button class="secondary" onclick="formRecord('${esc(r.ID)}')">แก้ไข</button>`:''}${['incoming','outgoing'].includes(p)?`<button class="danger" onclick="removeRecord('${esc(r.ID)}')">ลบ</button>`:''}</td></tr>`).join('')||'<tr><td colspan="10">ไม่มีข้อมูล</td></tr>'}</tbody></table></div><div class="pagination"><span>${rows.length?state.offset+1:0}-${Math.min(state.offset+state.limit,rows.length)} / ${rows.length}</span><button class="secondary" onclick="changePage(-1)">ก่อนหน้า</button><button class="secondary" onclick="changePage(1)">ถัดไป</button></div></div>`}function changePage(d){const n=state.offset+d*state.limit;if(n>=0&&n<state.rows.length){state.offset=n;drawTable()}}function sortBy(k){state.desc=state.sort===k?!state.desc:false;state.sort=k;drawTable()}
const incomingFields=[['BookNo','เลขที่หนังสือ'],['BookDate','วันที่หนังสือ','date'],['ReceiveDate','วันที่รับ','date'],['ReceiveTime','เวลารับ','time'],['Subject','เรื่อง'],['FromDepartment','จากหน่วยงาน'],['ToDepartment','ถึงหน่วยงาน'],['BookType','ประเภทหนังสือ'],['Urgency','ชั้นความเร็ว'],['Confidentiality','ชั้นความลับ'],['Responsible','ผู้รับผิดชอบ'],['Deadline','กำหนดดำเนินการ','date'],['Status','สถานะ'],['Details','รายละเอียด','textarea'],['Notes','หมายเหตุ','textarea'],['Important','เอกสารสำคัญ','checkbox'],['Permanent','เอกสารถาวร','checkbox'],['FolderID','รหัสแฟ้ม']];const outgoingFields=[['BookType','ประเภทหนังสือ'],['BookDate','วันที่','date'],['Subject','เรื่อง'],['Salutation','เรียน'],['FromDepartment','จาก'],['ToDepartment','ถึง'],['Enclosures','สิ่งที่ส่งมาด้วย'],['Body','เนื้อหา','textarea'],['PreparedBy','ผู้จัดทำ'],['Signatory','ผู้ลงนาม'],['Responsible','ผู้รับผิดชอบ'],['Deadline','กำหนดส่ง','date'],['Status','สถานะ'],['Notes','หมายเหตุ','textarea']];function field([k,label,type],r){let input;if(type==='textarea')input=`<textarea name="${k}">${esc(r[k])}</textarea>`;else if(type==='checkbox')input=`<input type="checkbox" name="${k}" ${r[k]===true||r[k]==='true'?'checked':''}>`;else if(k==='Status')input=`<select name="${k}">${option(status,r[k]||'รอดำเนินการ')}</select>`;else if(k==='Urgency')input=`<select name="${k}">${option(['ปกติ','ด่วน','ด่วนมาก','ด่วนที่สุด'],r[k])}</select>`;else if(k==='Confidentiality')input=`<select name="${k}">${option(['ปกติ','ลับ','ลับมาก','ลับที่สุด'],r[k])}</select>`;else if(k==='BookType')input=`<select name="${k}">${option(['หนังสือภายนอก','หนังสือภายใน','หนังสือประทับตรา','คำสั่ง','ประกาศ','บันทึกข้อความ'],r[k])}</select>`;else input=`<input name="${k}" type="${type||'text'}" value="${esc(r[k])}">`;return `<label class="${type==='textarea'?'wide':''}">${label}${input}</label>`}
function formRecord(id=''){const p=state.page,r=state.rows.find(x=>x.ID===id)||{},fields=p==='incoming'?incomingFields:p==='outgoing'?outgoingFields:[['Name','ชื่อแฟ้ม'],['Year','ปี'],['Department','กลุ่มงาน'],['Category','หมวดหมู่'],['Type','ประเภท']];openModal(id?'แก้ไขรายการ':'เพิ่มรายการ',`<form id="recordForm" onsubmit="saveRecord(event,'${esc(id)}')"><div class="grid">${fields.map(f=>field(f,r)).join('')}<label class="wide">แนบไฟล์<input id="file" type="file"></label></div><div class="actions"><button type="submit">บันทึก</button></div></form>`)}async function saveRecord(e,id){e.preventDefault();await run(async()=>{const f=e.target,d=Object.fromEntries(new FormData(f).entries());f.querySelectorAll('input[type=checkbox]').forEach(x=>d[x.name]=x.checked);if(id)d.ID=id;const p=state.page;const action=p==='incoming'?(id?'updateIncomingBook':'saveIncomingBook'):p==='outgoing'?(id?'updateOutgoingBook':'saveOutgoingBook'):'saveFolder';const saved=await api(action,d);const file=$('file').files[0];if(file)await uploadSelected(file,saved.ID||id);closeModal();toast('บันทึกสำเร็จ');loadPage()})}async function uploadSelected(file,documentId){if(file.size>7*1024*1024)throw Error('ไฟล์ต้องไม่เกิน 7 MB');const base64=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(String(reader.result).split(',')[1]);reader.onerror=rej;reader.readAsDataURL(file)});return api('uploadFile',{documentId,name:file.name,mimeType:file.type||'application/octet-stream',base64})}
async function viewRecord(id){await run(async()=>{const r=await api('getDocument',{id});const fields=Object.entries(r.document).map(([k,v])=>`<tr><th>${esc(k)}</th><td style="white-space:normal">${esc(v)}</td></tr>`).join('');openModal('รายละเอียดเอกสาร',`<div class="tablewrap"><table>${fields}</table></div><h4>ไฟล์แนบ</h4>${r.files.map(f=>`<p>${esc(f.FileName)} <button class="secondary" onclick="downloadFile('${esc(f.ID)}')">เปิดไฟล์</button></p>`).join('')||'ไม่มีไฟล์'}<h4>ประวัติการดำเนินการ</h4>${r.timeline.map(t=>`<p>${esc(t.CreatedAt)} · ${esc(t.Action)} · ${esc(t.Comment)} (${esc(t.Actor)})</p>`).join('')||'ไม่มีประวัติ'}<div class="actions"><button onclick="workflowAction('${esc(id)}','submitForApproval')">เสนอ</button><button onclick="workflowAction('${esc(id)}','issueOrder')">สั่งการ</button><button onclick="workflowAction('${esc(id)}','assignTask')">มอบหมาย</button><button onclick="workflowAction('${esc(id)}','updateTaskStatus')">เปลี่ยนสถานะ</button><button onclick="workflowAction('${esc(id)}','sendOutgoingBook')">ส่งหนังสือ</button><button class="secondary" onclick="printModal()">พิมพ์</button></div>`)})}async function downloadFile(id){await run(async()=>{const x=await api('getFileLink',{id});const u=safeUrl(x.url);if(!u)throw Error('ลิงก์ไฟล์ไม่ถูกต้อง');window.open(u,'_blank','noopener,noreferrer')})}function workflowAction(id,action){openModal('บันทึกการดำเนินการ',`<form onsubmit="saveWorkflow(event,'${esc(id)}','${action}')"><div class="grid"><label>ผู้รับ / ผู้รับผิดชอบ<input name="assignee"></label><label>สถานะ<select name="status">${option(status)}</select></label><label>กำหนดส่ง<input name="deadline" type="date"></label><label>คำสั่ง<select name="order">${option(['ทราบ','ดำเนินการ','ตรวจสอบ','แจ้งผู้เกี่ยวข้อง','มอบหมาย','อื่น ๆ'])}</select></label><label class="wide">ความเห็น / รายละเอียด<textarea name="comment"></textarea></label></div><button>ยืนยัน</button></form>`)}async function saveWorkflow(e,id,action){e.preventDefault();await run(async()=>{await api(action,{id,...Object.fromEntries(new FormData(e.target).entries())});closeModal();toast('ดำเนินการสำเร็จ');loadPage()})}async function removeRecord(id){if(!confirm('ยืนยันลบรายการนี้?'))return;await run(async()=>{await api(state.page==='incoming'?'deleteIncomingBook':'deleteOutgoingBook',{id});toast('ลบสำเร็จ');loadPage()})}
function editorPage(){const v=$('view');v.innerHTML=`<h2>จัดทำเอกสาร</h2><div class="panel"><form id="editorForm" onsubmit="createDocument(event)"><div class="grid">${outgoingFields.filter(x=>x[0]!=='Status').map(x=>field(x,{})).join('')}</div><div class="actions"><button>บันทึกและสร้าง PDF</button><button type="button" class="secondary" onclick="previewEditor()">ตัวอย่าง / พิมพ์</button></div></form></div>`}function previewEditor(){const d=Object.fromEntries(new FormData($('editorForm')).entries());const html=`<h2>${esc(d.BookType)}</h2><p>วันที่ ${esc(d.BookDate)}</p><p>เรื่อง ${esc(d.Subject)}</p><p>เรียน ${esc(d.Salutation)}</p><p>จาก ${esc(d.FromDepartment)} ถึง ${esc(d.ToDepartment)}</p><p>สิ่งที่ส่งมาด้วย ${esc(d.Enclosures)}</p><div style="white-space:pre-wrap">${esc(d.Body)}</div><p>ลงชื่อ ${esc(d.Signatory)}</p>`;openModal('ตัวอย่างเอกสาร',`<div id="preview">${html}</div><button onclick="printModal()">พิมพ์</button>`)}async function createDocument(e){e.preventDefault();await run(async()=>{const d=Object.fromEntries(new FormData(e.target).entries());const r=await api('saveOutgoingBook',d);const x=await api('createDocumentPdf',{id:r.ID});toast('สร้างเอกสารสำเร็จ');if(x.url)window.open(safeUrl(x.url),'_blank','noopener,noreferrer');navigate('outgoing')})}
async function reportsPage(){const r=await api('getReports',{});$('view').innerHTML=`<h2>รายงาน</h2><div class="cards">${Object.entries(r.summary).map(([k,v])=>`<div class="card">${esc(k)}<br><strong>${v}</strong></div>`).join('')}</div><div class="panel"><h3>รายการเกินกำหนด</h3><div class="tablewrap"><table><tr><th>เรื่อง</th><th>ผู้รับผิดชอบ</th><th>กำหนดส่ง</th><th>เกิน (วัน)</th><th>สถานะ</th></tr>${r.overdue.map(x=>`<tr><td>${esc(x.Subject)}</td><td>${esc(x.Responsible)}</td><td>${esc(x.Deadline)}</td><td>${x.DaysOverdue}</td><td>${esc(x.Status)}</td></tr>`).join('')}</table></div><div class="actions"><button onclick="printTable()">พิมพ์</button><button onclick="exportCsv()">ส่งออก CSV</button></div></div>`;state.rows=r.overdue}
async function settingsPage(){const [settings,users,departments,types]=await Promise.all([api('getSettings'),api('getUsers'),api('getDepartments'),api('getBookTypes')]);state.settings=settings;$('view').innerHTML=`<h2>ตั้งค่าระบบ</h2><div class="panel"><h3>รูปแบบเลขหนังสือและระบบ</h3><form onsubmit="saveConfig(event)" class="grid">${Object.entries(settings).filter(([k])=>!/(SECRET|TOKEN|KEY|PASSWORD)/i.test(k)).map(([k,v])=>`<label>${esc(k)}<input name="${esc(k)}" value="${esc(v)}"></label>`).join('')}<div class="wide"><button>บันทึกการตั้งค่า</button></div></form></div><div class="panel"><h3>ผู้ใช้งาน</h3><button onclick="userForm()">เพิ่ม / แก้ไขผู้ใช้</button>${simpleTable(users,['Email','Name','Department','Role','Status'])}</div><div class="panel"><h3>หน่วยงาน</h3><button onclick="lookupForm('saveDepartment')">เพิ่มหน่วยงาน</button>${simpleTable(departments,['Code','Name','Responsible','Status'])}</div><div class="panel"><h3>ประเภทหนังสือ</h3><button onclick="lookupForm('saveBookType')">เพิ่มประเภท</button>${simpleTable(types,['Name','Status'])}</div>`}function simpleTable(rows,cols){return `<div class="tablewrap"><table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</table></div>`}async function saveConfig(e){e.preventDefault();await run(async()=>{await api('saveSettings',Object.fromEntries(new FormData(e.target).entries()));toast('บันทึกแล้ว')})}function userForm(){openModal('จัดการผู้ใช้',`<form onsubmit="saveSimple(event,'saveUser')"><div class="grid">${['Email','Name','Department'].map(k=>field([k,k],{})).join('')}<label>Role<select name="Role">${option(['Super Admin','Admin','ผู้บริหาร','เจ้าหน้าที่สารบรรณ','อาจารย์/บุคลากร','ผู้ใช้งานทั่วไป'])}</select></label><label>สถานะ<select name="Status">${option(['Active','Inactive'])}</select></label></div><button>บันทึก</button></form>`)}function lookupForm(action){const keys=action==='saveDepartment'?['Code','Name','Responsible','Status']:['Name','Status'];openModal('เพิ่มข้อมูล',`<form onsubmit="saveSimple(event,'${action}')"><div class="grid">${keys.map(k=>field([k,k],{})).join('')}</div><button>บันทึก</button></form>`)}async function saveSimple(e,action){e.preventDefault();await run(async()=>{await api(action,Object.fromEntries(new FormData(e.target).entries()));closeModal();loadPage()})}function printTable(){window.print()}function printModal(){const html=$('modalBody').innerHTML;const w=window.open('','_blank');if(!w)return;w.document.write('<html><meta charset="utf-8"><body>'+html.replace(/<button[^>]*>[\s\S]*?<\/button>/g,'')+'</body></html>');w.document.close();w.print()}function exportCsv(){const rows=state.rows;if(!rows.length)return toast('ไม่มีข้อมูล');const keys=Object.keys(rows[0]);const csv=[keys,...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"'))].map(x=>x.join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='document-report.csv';a.click();URL.revokeObjectURL(a.href)}boot();
</script></body></html>
