<!doctype html>
<html lang="th" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ระบบสารบรรณดิจิทัล · มหาวิทยาลัยมหาสารคาม</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans Thai"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              800: '#1e3a8a',
              900: '#172554',
            },
            msu: {
              gold: '#eab308',
              navy: '#0f2547'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    /* Glassmorphism Surface */
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.85);
    }
    .dark .glass-panel {
      background: rgba(30, 41, 59, 0.82);
      border: 1px solid rgba(51, 65, 85, 0.85);
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark .glass-header {
      background: rgba(15, 23, 42, 0.78);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.7); }

    /* Form Controls inside Dynamic Forms */
    .form-field input:not([type="checkbox"]),
    .form-field select,
    .form-field textarea {
      width: 100%;
      border-radius: 0.75rem;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      color: #0f172a;
      transition: all 0.2s;
      outline: none;
    }
    .dark .form-field input:not([type="checkbox"]),
    .dark .form-field select,
    .dark .form-field textarea {
      border-color: #334155;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .form-field textarea { min-height: 96px; }

    /* Status Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      background: #e0f2fe;
      color: #0369a1;
    }
    .dark .badge { background: rgba(14, 165, 233, 0.2); color: #7dd3fc; }

    .badge[data-status="เกินกำหนด"], .badge[data-status="ยกเลิก"] {
      background: #ffe4e6; color: #be123c;
    }
    .dark .badge[data-status="เกินกำหนด"], .dark .badge[data-status="ยกเลิก"] {
      background: rgba(244, 63, 94, 0.2); color: #fda4af;
    }

    .badge[data-status="เสร็จสิ้น"], .badge[data-status="ส่งแล้ว"] {
      background: #dcfce7; color: #15803d;
    }
    .dark .badge[data-status="เสร็จสิ้น"], .dark .badge[data-status="ส่งแล้ว"] {
      background: rgba(34, 197, 94, 0.2); color: #86efac;
    }

    .badge[data-status="รอเสนอ"], .badge[data-status="รอสั่งการ"], .badge[data-status="รอลงนาม"], .badge[data-status="รอดำเนินการ"] {
      background: #fef3c7; color: #b45309;
    }
    .dark .badge[data-status="รอเสนอ"], .dark .badge[data-status="รอสั่งการ"], .dark .badge[data-status="รอลงนาม"], .dark .badge[data-status="รอดำเนินการ"] {
      background: rgba(245, 158, 11, 0.2); color: #fcd34d;
    }

    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      .glass-panel { border: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white min-h-screen">

  <!-- Main App Container -->
  <div id="app"></div>

  <!-- Mobile Backdrop -->
  <div id="sidebarBackdrop" onclick="toggleMobileMenu(false)" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-30 hidden md:hidden transition-opacity"></div>

  <!-- Universal Modal -->
  <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3 sm:p-5">
    <div class="glass-panel bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden border border-slate-200 dark:border-slate-800 animate-in fade-in zoom-in-95 duration-150">
      <div class="px-6 py-4 border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between bg-slate-50/60 dark:bg-slate-800/40">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-6 rounded-full bg-blue-600"></span>
          <h3 id="modalTitle" class="text-lg font-bold text-slate-900 dark:text-white"></h3>
        </div>
        <button onclick="closeModal()" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 dark:hover:text-slate-200 dark:hover:bg-slate-800 transition-colors" title="ปิดหน้าต่าง">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modalBody" class="p-6 overflow-y-auto space-y-4"></div>
    </div>
  </div>

  <!-- Global Loading Indicator -->
  <div id="loader" class="fixed top-4 right-4 z-50 hidden items-center gap-2.5 px-4 py-2.5 rounded-full glass-panel shadow-lg border border-blue-200 dark:border-blue-900/60 text-xs font-medium text-blue-700 dark:text-blue-300">
    <svg class="w-4 h-4 animate-spin text-blue-600" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <span>กำลังซิงค์ข้อมูล...</span>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden max-w-sm transform transition-all duration-300"></div>

<script>
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbyGlu5eZJPsVn532lmW-Obs7FY_wl-IYkA0O00AyKLmtJTGiHdXIu7r3e1yqT75Dlrg2g/exec';

const state = {
  token: sessionStorage.getItem('ddms_token') || '',
  user: null,
  page: 'dashboard',
  rows: [],
  sort: 'CreatedAt',
  desc: true,
  offset: 0,
  limit: 15,
  filter: '',
  statusFilter: '',
  settings: {},
  lookups: {},
  dashboard: null,
  theme: localStorage.getItem('ddms_theme') || 'light'
};

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const date = v => v ? String(v).slice(0, 10) : '';
const safeUrl = u => /^https:\/\/(drive|docs)\.google\.com\//.test(u || '') ? u : '';

// Column & Field Thai Translations
const colLabels = {
  RegisterNo: 'เลขทะเบียน',
  BookNo: 'เลขที่หนังสือ',
  Subject: 'เรื่อง',
  FromDepartment: 'จากหน่วยงาน',
  ToDepartment: 'ถึงหน่วยงาน',
  Responsible: 'ผู้รับผิดชอบ',
  Deadline: 'กำหนดส่ง',
  Status: 'สถานะ',
  Name: 'ชื่อแฟ้ม / รายการ',
  Year: 'ปี พ.ศ.',
  Department: 'หน่วยงาน/กลุ่มงาน',
  Category: 'หมวดหมู่',
  Type: 'ประเภท',
  BookDate: 'ลงวันที่',
  ReceiveDate: 'วันที่รับ',
  ReceiveTime: 'เวลารับ',
  BookType: 'ประเภทหนังสือ',
  Urgency: 'ชั้นความเร็ว',
  Confidentiality: 'ชั้นความลับ',
  Details: 'รายละเอียด',
  Notes: 'หมายเหตุ',
  Important: 'เอกสารสำคัญ',
  Permanent: 'เก็บถาวร',
  FolderID: 'รหัสแฟ้ม',
  Salutation: 'เรียน',
  Enclosures: 'สิ่งที่ส่งมาด้วย',
  Body: 'เนื้อหาสาระ',
  PreparedBy: 'ผู้จัดทำ',
  Signatory: 'ผู้ลงนาม',
  CreatedAt: 'วันที่สร้าง',
  UpdatedAt: 'แก้ไขล่าสุด',
  ID: 'รหัสอ้างอิง',
  Email: 'อีเมล',
  Role: 'ระดับสิทธิ์',
  Code: 'รหัสหน่วยงาน'
};
const tCol = k => colLabels[k] || k;

// Theme Controller
function applyTheme(t) {
  state.theme = t;
  localStorage.setItem('ddms_theme', t);
  if (t === 'dark') {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
}
function toggleTheme() {
  applyTheme(state.theme === 'dark' ? 'light' : 'dark');
  if (state.user) renderHeaderThemeIcon();
}
function renderHeaderThemeIcon() {
  const btn = $('themeBtn');
  if (!btn) return;
  btn.innerHTML = state.theme === 'dark'
    ? `<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`
    : `<svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`;
}
applyTheme(state.theme);

// Toast Notification
let toastTimer;
const toast = (m, type = 'info') => {
  const e = $('toast');
  const isErr = /ไม่|ผิดพลาด|ล้มเหลว|เกิน|กรุณา/.test(m) || type === 'error';
  const bg = isErr ? 'bg-rose-600 text-white' : 'bg-slate-900 dark:bg-blue-600 text-white';
  const icon = isErr
    ? `<svg class="w-5 h-5 shrink-0 text-rose-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`
    : `<svg class="w-5 h-5 shrink-0 text-emerald-400 dark:text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
  e.innerHTML = `<div class="${bg} px-4 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium border border-white/10">${icon}<span>${esc(m)}</span></div>`;
  e.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => e.classList.add('hidden'), 3800);
};

const setLoading = show => {
  const el = $('loader');
  if (!el) return;
  if (show) { el.classList.remove('hidden'); el.classList.add('flex'); }
  else { el.classList.add('hidden'); el.classList.remove('flex'); }
};

async function api(action, data = {}) {
  if (API_URL.startsWith('PASTE_')) throw Error('กรุณากำหนด API_URL ใน index.html');
  setLoading(true);
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: state.token, data })
    });
    const x = await r.json();
    if (!x.success) throw Error(x.message || 'ไม่สามารถดำเนินการได้');
    return x.data;
  } finally {
    setLoading(false);
  }
}

async function run(fn) {
  try {
    return await fn();
  } catch (e) {
    toast(e.message, 'error');
    if (/เซสชัน|เข้าสู่ระบบใหม่/.test(e.message)) logout();
    return null;
  }
}

function logout() {
  state.token = '';
  state.user = null;
  sessionStorage.removeItem('ddms_token');
  render();
}

function toggleMobileMenu(force) {
  const side = $('side');
  const backdrop = $('sidebarBackdrop');
  if (!side || !backdrop) return;
  const isOpen = typeof force === 'boolean' ? force : side.classList.contains('-translate-x-full');
  if (isOpen) {
    side.classList.remove('-translate-x-full');
    backdrop.classList.remove('hidden');
  } else {
    side.classList.add('-translate-x-full');
    backdrop.classList.add('hidden');
  }
}

function render() {
  if (!state.user) {
    $('app').innerHTML = `
      <div class="min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden bg-gradient-to-br from-slate-100 via-blue-50/50 to-indigo-100/70 dark:from-slate-950 dark:via-slate-900 dark:to-blue-950/40">
        <!-- Decorative blobs -->
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-500/15 dark:bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-amber-400/15 dark:bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="fixed top-5 right-5">
          <button onclick="toggleTheme()" id="themeBtn" class="p-2.5 rounded-xl glass-panel shadow-sm hover:scale-105 transition" title="สลับโหมดสี"></button>
        </div>

        <div class="glass-panel w-full max-w-md rounded-3xl p-8 sm:p-10 shadow-2xl relative z-10">
          <div class="flex items-center gap-3.5 mb-6">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-700 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-blue-600/30">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400">E-Saraban System</span>
              <h1 class="text-2xl font-bold text-slate-900 dark:text-white leading-tight">ระบบสารบรรณดิจิทัล</h1>
            </div>
          </div>

          <p class="text-sm text-slate-600 dark:text-slate-400 mb-6 pb-5 border-b border-slate-200/80 dark:border-slate-800">
            ภาควิชาเทคโนโลยีและสื่อสารการศึกษา<br>
            <span class="text-xs text-slate-500">คณะศึกษาศาสตร์ มหาวิทยาลัยมหาสารคาม</span>
          </p>

          <form onsubmit="event.preventDefault();login()" class="space-y-4 form-field">
            <label class="block">
              <span class="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 block">อีเมลบัญชีผู้ใช้งาน</span>
              <input id="email" type="email" placeholder="name@msu.ac.th" required autocomplete="username">
            </label>
            <label class="block">
              <span class="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 block">รหัสผ่าน</span>
              <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
            </label>
            <div class="pt-2">
              <button type="submit" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-700 to-blue-600 hover:from-blue-800 hover:to-blue-700 text-white font-semibold text-sm shadow-lg shadow-blue-600/25 transition transform active:scale-[0.99] flex items-center justify-center gap-2">
                <span>เข้าสู่ระบบ</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </button>
            </div>
          </form>

          <div class="mt-6 p-3.5 rounded-2xl bg-slate-100/80 dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-700/50 text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
            💡 <b>สำหรับผู้ดูแลระบบ:</b> สามารถตั้งรหัสผ่านใหม่ใน Google Sheets แท็บ <code class="text-blue-600 dark:text-blue-400 font-semibold">Users</code> คอลัมน์ <code class="text-blue-600 dark:text-blue-400 font-semibold">PasswordReset</code> ระบบจะเข้ารหัสอัตโนมัติเมื่อเข้าสู่ระบบสำเร็จ
          </div>
        </div>
      </div>`;
    renderHeaderThemeIcon();
    return;
  }

  const nav = [
    ['dashboard', '🏠', 'ภาพรวมระบบ'],
    ['incoming', '📥', 'ทะเบียนหนังสือรับ'],
    ['outgoing', '📤', 'ทะเบียนหนังสือส่ง'],
    ['workflow', '📋', 'เสนอ / สั่งการ'],
    ['editor', '📄', 'จัดทำเอกสาร'],
    ['folders', '🗂️', 'ทะเบียน / แฟ้มงาน'],
    ['search', '🔎', 'ค้นหาเอกสาร'],
    ['reports', '📊', 'รายงานสรุป'],
    ['settings', '⚙️', 'ตั้งค่าระบบ']
  ];

  $('app').innerHTML = `
    <div class="min-h-screen flex bg-slate-50 dark:bg-slate-950">
      <!-- Sidebar -->
      <aside id="side" class="fixed md:sticky top-0 left-0 z-40 h-screen w-64 shrink-0 bg-msu-navy dark:bg-slate-900 text-white flex flex-col justify-between border-r border-slate-800 transition-transform duration-200 -translate-x-full md:translate-x-0 no-print">
        <div>
          <!-- Brand Header -->
          <div class="p-5 flex items-center justify-between border-b border-white/10">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-500 text-slate-950 font-black flex items-center justify-center shadow-md shadow-amber-500/20 text-lg">
                ส
              </div>
              <div>
                <div class="font-bold text-sm tracking-tight text-white leading-none">ระบบสารบรรณดิจิทัล</div>
                <div class="text-[11px] text-blue-200/80 mt-1">ภาควิชาเทคโนโลยีฯ มมส</div>
              </div>
            </div>
            <button class="md:hidden text-slate-300 hover:text-white" onclick="toggleMobileMenu(false)">✕</button>
          </div>

          <!-- Navigation -->
          <div class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-160px)]">
            <div class="px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-blue-300/60">เมนูหลัก</div>
            ${nav.map(([k, icon, label]) => {
              const active = state.page === k;
              return `
                <button onclick="navigate('${k}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${
                  active
                    ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30'
                    : 'text-slate-300 hover:bg-white/10 hover:text-white'
                }">
                  <span class="text-base">${icon}</span>
                  <span>${label}</span>${active ? '<span class="ml-auto w-1.5 h-1.5 rounded-full bg-amber-400"></span>' : ''}
                </button>`;
            }).join('')}
          </div>
        </div>

        <!-- User Footer inside Sidebar -->
        <div class="p-4 border-t border-white/10 bg-black/20">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-blue-500/30 border border-blue-400/40 flex items-center justify-center font-bold text-sm text-blue-100 shrink-0">
              ${esc((state.user.Name || 'U').slice(0, 1))}
            </div>
            <div class="min-w-0 flex-1">

async function login() {
  await run(async () => {
    const email = $('email').value.trim();
    const x = await api('login', { email, password: $('password').value });
    state.token = x.token;
    state.user = x.user;
    sessionStorage.setItem('ddms_token', x.token);
    toast('เข้าสู่ระบบสำเร็จ');
    render();
  });
}

async function boot() {
  if (!state.token) return render();
  await run(async () => {
    state.user = await api('getCurrentUser');
    render();
  });
  if (!state.user) render();
}

function navigate(p) {
  state.page = p;
  state.offset = 0;
  state.filter = '';
  state.statusFilter = '';
  toggleMobileMenu(false);
  render();
}

function bars(data) {
  if (!data || !data.length) return '<div class="h-44 flex items-center justify-center text-xs text-slate-400">ไม่มีข้อมูลรายเดือน</div>';
  const max = Math.max(1, ...data.map(x => Math.max(Number(x.incoming || 0), Number(x.outgoing || 0))));
  return `
    <div class="pt-6 pb-2 overflow-x-auto">
      <div class="flex items-end gap-4 h-48 min-w-[480px] px-2 border-b border-slate-200 dark:border-slate-800">
        ${data.map(x => {
          const hIn = Math.max(4, Math.round((Number(x.incoming || 0) / max) * 155));
          const hOut = Math.max(4, Math.round((Number(x.outgoing || 0) / max) * 155));
          return `
            <div class="flex-1 flex flex-col items-center group">
              <div class="flex items-end gap-1.5 h-[165px]">
                <div class="w-4 sm:w-5 bg-gradient-to-t from-blue-700 to-blue-500 rounded-t-md transition-all group-hover:opacity-85 relative" style="height:${hIn}px" title="รับ: ${x.incoming}"></div>
                <div class="w-4 sm:w-5 bg-gradient-to-t from-teal-600 to-teal-400 rounded-t-md transition-all group-hover:opacity-85 relative" style="height:${hOut}px" title="ส่ง: ${x.outgoing}"></div>
              </div>
              <div class="text-[11px] font-medium text-slate-500 dark:text-slate-400 mt-2">${esc(x.month)}</div>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

async function listPage() {
  const p = state.page;
  let rows;
  if (p === 'incoming') rows = await api('getIncomingBooks');
  else if (p === 'outgoing') rows = await api('getOutgoingBooks');
  else if (p === 'workflow') rows = await api('getWorkflowQueue');
  else if (p === 'folders') rows = await api('getFolders');
  else rows = await api('searchDocuments', {});
  state.rows = rows || [];
  drawTable();
}

function drawTable() {
  const p = state.page;
  const kw = state.filter.trim().toLowerCase();
  const st = state.statusFilter;

  const rows = state.rows.filter(r => {
    const matchKw = !kw || Object.values(r).some(v => String(v ?? '').toLowerCase().includes(kw));
    const matchSt = !st || String(r.Status ?? '') === st;
    return matchKw && matchSt;
  });

  rows.sort((a, b) => String(a[state.sort] ?? '').localeCompare(String(b[state.sort] ?? ''), 'th', { numeric: true }) * (state.desc ? -1 : 1));

  const page = rows.slice(state.offset, state.offset + state.limit);
  const cols = p === 'folders'
    ? ['Name', 'Year', 'Department', 'Category', 'Type']
    : ['RegisterNo', 'BookNo', 'Subject', 'FromDepartment', 'ToDepartment', 'Responsible', 'Deadline', 'Status'];

  $('view').innerHTML = `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">${titles[p]}</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">พบข้อมูลทั้งหมด ${rows.length.toLocaleString()} รายการ</p>

          </button>` : ''}
        <button onclick="printTable()" class="px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold hover:bg-slate-50 transition">🖨️ พิมพ์</button>
        <button onclick="exportCsv()" class="px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold hover:bg-slate-50 transition">📥 ส่งออก CSV</button>
      </div>
    </div>

    <div class="glass-panel rounded-2xl shadow-xs overflow-hidden">
      <!-- Search & Filter Toolbar -->
      <div class="p-4 border-b border-slate-200/80 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 bg-slate-50/50 dark:bg-slate-900/40 no-print">
        <div class="flex flex-wrap items-center gap-3 flex-1 min-w-[240px]">
          <div class="relative flex-1 max-w-sm">
            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input
              placeholder="ค้นหาเลขที่, เรื่อง, หน่วยงาน, ผู้รับผิดชอบ..."
              value="${esc(state.filter)}"
              oninput="state.filter=this.value;state.offset=0;drawTable()"
              class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs focus:outline-none focus:border-blue-500">
          </div>
          ${p !== 'folders' ? `
            <select onchange="state.statusFilter=this.value;state.offset=0;drawTable()" class="py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs focus:outline-none focus:border-blue-500">
              <option value="">ทุกสถานะเอกสาร</option>
              ${option(status, state.statusFilter)}
            </select>` : ''}
        </div>
      </div>

      <!-- Data Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs sm:text-sm">
          <thead>
            <tr class="bg-slate-100/80 dark:bg-slate-800/70 text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-800">
              ${cols.map(c => `
                <th onclick="sortBy('${c}')" class="py-3.5 px-4 font-semibold cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 whitespace-nowrap select-none">
                  <div class="flex items-center gap-1">
                    <span>${esc(tCol(c))}</span>
                    <span class="text-[10px] ${state.sort === c ? 'text-blue-600 font-bold' : 'opacity-40'}">${state.sort === c ? (state.desc ? '▼' : '▲') : '↕'}</span>

                </th>`).join('')}
              <th class="py-3.5 px-4 font-semibold text-right whitespace-nowrap no-print">จัดการ</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200/60 dark:divide-slate-800/70">
            ${page.map(r => `
              <tr class="hover:bg-blue-50/40 dark:hover:bg-slate-800/40 transition-colors">
                ${cols.map(c => {
                  if (c === 'Status') {
                    return `<td class="py-3.5 px-4 whitespace-nowrap"><span class="badge" data-status="${esc(r[c])}">${esc(r[c] || '-')}</span></td>`;
                  }
                  if (c === 'Subject') {
                    const urg = r.Urgency && r.Urgency !== 'ปกติ' ? `<span class="mr-1.5 px-2 py-0.5 rounded-md text-[10px] font-bold bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300">${esc(r.Urgency)}</span>` : '';
                    return `<td class="py-3.5 px-4 font-medium text-slate-900 dark:text-white max-w-xs sm:max-w-md truncate" title="${esc(r[c])}">${urg}${esc(r[c] || '-')}</td>`;
                  }
                  if (c === 'Deadline') {
                    return `<td class="py-3.5 px-4 whitespace-nowrap text-slate-600 dark:text-slate-400">${esc(date(r[c]) || '-')}</td>`;
                  }
                  return `<td class="py-3.5 px-4 whitespace-nowrap text-slate-700 dark:text-slate-300">${esc(r[c] || '-')}</td>`;
                }).join('')}
                <td class="py-3 px-4 whitespace-nowrap text-right space-x-1 no-print">
                  <button onclick="viewRecord('${esc(r.ID)}')" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium transition">รายละเอียด</button>
                  ${p !== 'search' ? `<button onclick="formRecord('${esc(r.ID)}')" class="px-2.5 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/60 dark:hover:bg-blue-900/70 text-blue-600 dark:text-blue-300 text-xs font-medium transition">แก้ไข</button>` : ''}
                  ${['incoming', 'outgoing'].includes(p) ? `<button onclick="removeRecord('${esc(r.ID)}')" class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/60 dark:hover:bg-rose-900/70 text-rose-600 dark:text-rose-300 text-xs font-medium transition">ลบ</button>` : ''}

              </tr>`).join('') || `
              <tr>
                <td colspan="${cols.length + 1}" class="py-12 text-center text-slate-400 text-sm">

              </tr>`}
          </tbody>
        </table>

        <span>แสดง <b>${rows.length ? state.offset + 1 : 0} - ${Math.min(state.offset + state.limit, rows.length)}</b> จากทั้งหมด <b>${rows.length}</b> รายการ</span>
        <div class="flex items-center gap-2">
          <button onclick="changePage(-1)" ${state.offset === 0 ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 disabled:opacity-40 hover:bg-slate-100 transition font-medium">ก่อนหน้า</button>
          <button onclick="changePage(1)" ${state.offset + state.limit >= rows.length ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 disabled:opacity-40 hover:bg-slate-100 transition font-medium">ถัดไป</button>
        </div>
      </div>
    </div>`;
}

function changePage(d) {
  const n = state.offset + d * state.limit;
  if (n >= 0 && n < state.rows.length) {
    state.offset = n;
    drawTable();
  }
}

function sortBy(k) {
  state.desc = state.sort === k ? !state.desc : false;
  state.sort = k;
  drawTable();
}

function field([k, label, type], r) {
  let input;
  if (type === 'textarea') {
    input = `<textarea name="${k}" placeholder="ระบุ${esc(label)}...">${esc(r[k])}</textarea>`;
  } else if (type === 'checkbox') {
    return `
      <label class="flex items-center gap-2.5 p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/40 cursor-pointer">
        <input type="checkbox" name="${k}" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500" ${r[k] === true || r[k] === 'true' ? 'checked' : ''}>
        <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">${esc(label)}</span>
      </label>`;
  } else if (k === 'Status') {
    input = `<select name="${k}">${option(status, r[k] || 'รอดำเนินการ')}</select>`;
  } else if (k === 'Urgency') {
    input = `<select name="${k}">${option(['ปกติ', 'ด่วน', 'ด่วนมาก', 'ด่วนที่สุด'], r[k])}</select>`;
  } else if (k === 'Confidentiality') {
    input = `<select name="${k}">${option(['ปกติ', 'ลับ', 'ลับมาก', 'ลับที่สุด'], r[k])}</select>`;
  } else if (k === 'BookType') {
    input = `<select name="${k}">${option(['หนังสือภายนอก', 'หนังสือภายใน', 'หนังสือประทับตรา', 'คำสั่ง', 'ประกาศ', 'บันทึกข้อความ'], r[k])}</select>`;
  } else {
    const val = (type === 'date' && r[k]) ? date(r[k]) : (r[k] ?? '');
    input = `<input name="${k}" type="${type || 'text'}" value="${esc(val)}">`;
  }
  return `
    <label class="block ${type === 'textarea' ? 'sm:col-span-2' : ''}">
      <span class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5 block">${esc(label)}</span>
      ${input}
    </label>`;
}

async function saveRecord(e, id) {
  e.preventDefault();
  await run(async () => {
    const f = e.target;
    const d = Object.fromEntries(new FormData(f).entries());
    f.querySelectorAll('input[type=checkbox]').forEach(x => d[x.name] = x.checked);
    if (id) d.ID = id;
    const p = state.page;
    const action = p === 'incoming'
      ? (id ? 'updateIncomingBook' : 'saveIncomingBook')
      : p === 'outgoing'
        ? (id ? 'updateOutgoingBook' : 'saveOutgoingBook')
        : 'saveFolder';
    const saved = await api(action, d);
    const file = $('file').files[0];
    if (file) await uploadSelected(file, saved.ID || id);
    closeModal();
    toast('บันทึกข้อมูลเรียบร้อยแล้ว');
    loadPage();
  });
}

async function uploadSelected(file, documentId) {
  if (file.size > 7 * 1024 * 1024) throw Error('ขนาดไฟล์ต้องไม่เกิน 7 MB');
  const base64 = await new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(String(reader.result).split(',')[1]);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
  return api('uploadFile', { documentId, name: file.name, mimeType: file.type || 'application/octet-stream', base64 });
}

function simpleTable(rows, cols) {
  return `
    <div class="overflow-x-auto rounded-xl border border-slate-200/80 dark:border-slate-800">
      <table class="w-full text-left text-xs sm:text-sm">
        <thead>
          <tr class="bg-slate-100/80 dark:bg-slate-800/70 text-slate-600 dark:text-slate-300">
            ${cols.map(c => `<th class="py-3 px-4 font-semibold">${esc(tCol(c))}</th>`).join('')}
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200/60 dark:divide-slate-800">
          ${rows.map(r => `
            <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40">
              ${cols.map(c => `<td class="py-3 px-4">${esc(r[c] || '-')}</td>`).join('')}
            </tr>`).join('') || `<tr><td colspan="${cols.length}" class="py-6 text-center text-slate-400">ไม่มีข้อมูล</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

async function saveConfig(e) {

}

function lookupForm(action) {
  const keys = action === 'saveDepartment'
    ? [['Code', 'รหัสหน่วยงาน'], ['Name', 'ชื่อหน่วยงาน'], ['Responsible', 'ผู้รับผิดชอบหลัก'], ['Status', 'สถานะ']]
    : [['Name', 'ชื่อประเภทหนังสือ'], ['Status', 'สถานะ']];
  openModal(
    'เพิ่มข้อมูลอ้างอิง',
    `<form onsubmit="saveSimple(event,'${action}')" class="form-field space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${keys.map(k => field(k, {})).join('')}</div>
      <div class="flex justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-800">
        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold">ยกเลิก</button>
        <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold">บันทึกข้อมูล</button>
      </div>
    </form>`
  );
}

async function saveSimple(e, action) {
  e.preventDefault();
  await run(async () => {
    await api(action, Object.fromEntries(new FormData(e.target).entries()));
    closeModal();
    toast('บันทึกข้อมูลสำเร็จ');
    loadPage();
  });
}

function printTable() { window.print(); }

function printModal() {
  const html = $('modalBody').innerHTML;
  const w = window.open('', '_blank');
  if (!w) return;
  w.document.write(`
    <html>
      <head>
        <meta charset="utf-8">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
        <style>body{font-family:'Noto Sans Thai',sans-serif;padding:24px;color:#111}button{display:none}</style>
      </head>
      <body>${html.replace(/<button[^>]*>[\s\S]*?<\/button>/g, '')}</body>
    </html>`);
  w.document.close();
  setTimeout(() => w.print(), 250);
}

function exportCsv() {
  const rows = state.rows;
  if (!rows.length) return toast('ไม่มีข้อมูลสำหรับส่งออก', 'error');
  const keys = Object.keys(rows[0]);
  const csv = [keys, ...rows.map(r => keys.map(k => '"' + String(r[k] ?? '').replace(/"/g, '""') + '"'))].map(x => x.join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `saraban-${state.page}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
