<!doctype html>
<html lang="th" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ระบบสารบรรณดิจิทัล · มหาวิทยาลัยมหาสารคาม</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans Thai"', 'system-ui', 'sans-serif'],
            gov: ['"Sarabun"', '"TH SarabunPSK"', 'sans-serif']
          },
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af', 800: '#1e3a8a', 900: '#172554' },
            msu: { gold: '#eab308', navy: '#0f2547' }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif; transition: background-color 0.25s ease, color 0.25s ease; }
    .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(226, 232, 240, 0.85); }
    .dark .glass-panel { background: rgba(30, 41, 59, 0.82); border: 1px solid rgba(51, 65, 85, 0.85); }
    .glass-header { background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .dark .glass-header { background: rgba(15, 23, 42, 0.78); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 9999px; }
    .form-field input:not([type="checkbox"]), .form-field select, .form-field textarea {
      width: 100%; border-radius: 0.75rem; border: 1px solid #cbd5e1; background-color: #ffffff; padding: 0.625rem 0.875rem; font-size: 0.875rem; color: #0f172a; outline: none; transition: all 0.2s;
    }
    .dark .form-field input:not([type="checkbox"]), .dark .form-field select, .dark .form-field textarea { border-color: #334155; background-color: #0f172a; color: #f8fafc; }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    .form-field textarea { min-height: 110px; }
    .badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.65rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; background: #e0f2fe; color: #0369a1; }
    .dark .badge { background: rgba(14, 165, 233, 0.2); color: #7dd3fc; }
    .badge[data-status="เกินกำหนด"], .badge[data-status="ยกเลิก"] { background: #ffe4e6; color: #be123c; }
    .badge[data-status="เสร็จสิ้น"], .badge[data-status="ส่งแล้ว"] { background: #dcfce7; color: #15803d; }
    .badge[data-status="รอเสนอ"], .badge[data-status="รอสั่งการ"], .badge[data-status="รอลงนาม"], .badge[data-status="รอดำเนินการ"] { background: #fef3c7; color: #b45309; }
    @media print { .no-print { display: none !important; } body { background: white !important; } .glass-panel { border: none !important; box-shadow: none !important; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen">
  <div id="app"></div>
  <div id="sidebarBackdrop" onclick="toggleMobileMenu(false)" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-30 hidden md:hidden"></div>
  <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3 sm:p-5">
    <div class="glass-panel bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[94vh] flex flex-col overflow-hidden border border-slate-200 dark:border-slate-800">
      <div class="px-6 py-4 border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between bg-slate-50/60 dark:bg-slate-800/40">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-6 rounded-full bg-blue-600"></span>
          <h3 id="modalTitle" class="text-lg font-bold text-slate-900 dark:text-white"></h3>
        </div>
        <button onclick="closeModal()" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-200 dark:hover:text-slate-200 dark:hover:bg-slate-800 transition">✕</button>
      </div>
      <div id="modalBody" class="p-6 overflow-y-auto space-y-4"></div>
    </div>
  </div>
  <div id="loader" class="fixed top-4 right-4 z-50 hidden items-center gap-2.5 px-4 py-2.5 rounded-full glass-panel shadow-lg text-xs font-medium text-blue-600">
    <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
    <span>กำลังซิงค์ข้อมูล...</span>
  </div>
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden max-w-sm transition-all"></div>

<script>
'use strict';
const API_URL = 'https://script.google.com/macros/s/AKfycbw9ihyhbYDPgCXA2TE46_Ua5i9jNFvK1JQJm8iRmaFQsct-xdzeamsfEH4rTH5heWkF/exec';
const GARUDA_URL = 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Garuda_Emb_of_Thailand.svg/240px-Garuda_Emb_of_Thailand.svg.png';

const state = {
  token: sessionStorage.getItem('ddms_token') || '',
  user: null, page: 'dashboard', rows: [], sort: 'CreatedAt', desc: true, offset: 0, limit: 15, filter: '', statusFilter: '', theme: localStorage.getItem('ddms_theme') || 'light'
};

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date = v => v ? String(v).slice(0, 10) : '';
const safeUrl = u => /^https:\/\/(drive|docs)\.google\.com\//.test(u || '') ? u : '';

function toThaiDigits(str) { return String(str ?? '').replace(/[0-9]/g, d => '๐๑๒๓UAGES๗๘๙'[d] || d); }
function toArabicDigits(str) { return String(str ?? '').replace(/[๐-๙]/g, d => '0123456789'['๐๑๒๓๔๕๖๗๘๙'.indexOf(d)] || d); }

const colLabels = {
  RegisterNo: 'เลขทะเบียน', BookNo: 'เลขที่หนังสือ', Subject: 'เรื่อง', FromDepartment: 'จากหน่วยงาน', ToDepartment: 'ถึงหน่วยงาน', Responsible: 'ผู้รับผิดชอบ', Deadline: 'กำหนดส่ง', Status: 'สถานะ', Name: 'ชื่อแฟ้ม / รายการ', Year: 'ปี พ.ศ.', Department: 'หน่วยงาน', Category: 'หมวดหมู่', Type: 'ประเภท', BookDate: 'ลงวันที่', BookType: 'ประเภทหนังสือ', Urgency: 'ชั้นความเร็ว', Signatory: 'ผู้ลงนาม'
};
const tCol = k => colLabels[k] || k;

function applyTheme(t) {
  state.theme = t; localStorage.setItem('ddms_theme', t);
  if (t === 'dark') document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}
function toggleTheme() { applyTheme(state.theme === 'dark' ? 'light' : 'dark'); if (state.user) renderHeaderThemeIcon(); }
function renderHeaderThemeIcon() {
  const btn = $('themeBtn'); if (!btn) return;
  btn.innerHTML = state.theme === 'dark' ? '☀️' : '🌙';
}
applyTheme(state.theme);

let toastTimer;
const toast = (m, type='info') => {
  const e = $('toast');
  const isErr = /ไม่|ผิดพลาด|ล้มเหลว/.test(m) || type === 'error';
  e.innerHTML = `<div class="${isErr ? 'bg-rose-600' : 'bg-slate-900'} text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold flex items-center gap-2"><span>${esc(m)}</span></div>`;
  e.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.add('hidden'), 3500);
};

const setLoading = show => { const el = $('loader'); if (el) { el.classList[show ? 'remove' : 'add']('hidden'); el.classList[show ? 'add' : 'remove']('flex'); } };

async function api(action, data = {}) {
  setLoading(true);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: state.token, data }) });
    const x = await r.json();
    if (!x.success) throw Error(x.message || 'ไม่สามารถดำเนินการได้');
    return x.data;
  } finally { setLoading(false); }
}

async function run(fn) { try { return await fn(); } catch(e) { toast(e.message, 'error'); if (/เซสชัน/.test(e.message)) logout(); return null; } }
function logout() { state.token = ''; state.user = null; sessionStorage.removeItem('ddms_token'); render(); }
function toggleMobileMenu(f) { const s = $('side'), b =$('sidebarBackdrop'); if (s) { const open = typeof f === 'boolean' ? f : s.classList.contains('-translate-x-full'); s.classList[open ? 'remove' : 'add']('-translate-x-full'); b.classList[open ? 'remove' : 'add']('hidden'); } }

function render() {
  if (!state.user) {
    $('app').innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 dark:from-slate-950 dark:to-blue-950">
        <div class="glass-panel w-full max-w-md rounded-3xl p-8 shadow-2xl">
          <div class="flex items-center gap-3 mb-6">
            <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-600/30">ส</div>
            <div><h1 class="text-xl font-bold">ระบบสารบรรณดิจิทัล</h1><p class="text-xs text-slate-500">ม.มหาสารคาม</p></div>
          </div>
          <form onsubmit="event.preventDefault();login()" class="form-field space-y-4">
            <label>อีเมล Google<input id="email" type="email" required></label>
            <label>รหัสผ่าน<input id="password" type="password" required></label>
            <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 text-white font-semibold text-xs shadow-lg shadow-blue-600/25">เข้าสู่ระบบ</button>
          </form>
        </div>
      </div>`;
    return;
  }
  const nav = [['dashboard','🏠','ภาพรวม'],['incoming','📥','หนังสือรับ'],['outgoing','📤','หนังสือส่ง'],['workflow','📋','เสนอ/สั่งการ'],['editor','📄','จัดทำเอกสาร'],['folders','🗂️','แฟ้มงาน'],['search','🔎','ค้นหา'],['reports','📊','รายงาน'],['settings','⚙️','ตั้งค่า']];
  $('app').innerHTML = `
    <div class="min-h-screen flex bg-slate-50 dark:bg-slate-950">
      <aside id="side" class="fixed md:sticky top-0 left-0 z-40 h-screen w-64 bg-msu-navy dark:bg-slate-900 text-white flex flex-col justify-between border-r border-slate-800 transition-transform -translate-x-full md:translate-x-0 no-print">
        <div>
          <div class="p-5 flex items-center justify-between border-b border-white/10">
            <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-amber-500 text-slate-950 font-bold flex items-center justify-center">ส</div><div><div class="font-bold text-sm">สารบรรณดิจิทัล</div><div class="text-[10px] text-blue-200">ภาควิชาเทคโนโลยีฯ</div></div></div>
            <button class="md:hidden" onclick="toggleMobileMenu(false)">✕</button>
          </div>
          <div class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-140px)]">
            ${nav.map(([k, icon, label]) => `<button onclick="navigate('${k}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${state.page===k?'bg-blue-600 text-white shadow':'text-slate-300 hover:bg-white/10'}"><span>${icon}</span><span>${label}</span></button>`).join('')}
          </div>
        </div>
        <div class="p-4 border-t border-white/10 text-xs truncate">👤 ${esc(state.user.Name)}</div>
      </aside>
      <div class="flex-1 flex flex-col min-w-0">
        <header class="sticky top-0 z-20 glass-header border-b border-slate-200 dark:border-slate-800 px-4 sm:px-8 py-3.5 flex items-center justify-between no-print">
          <button class="md:hidden p-2 rounded-xl bg-slate-100 dark:bg-slate-800" onclick="toggleMobileMenu(true)">☰</button>
          <div class="text-xs sm:text-sm font-bold">สำนักงานดิจิทัล · มหาวิทยาลัยมหาสารคาม</div>
          <div class="flex items-center gap-3"><button onclick="toggleTheme()" id="themeBtn" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800">🌙</button><button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-rose-50 text-rose-600 text-xs font-semibold">ออกจากระบบ</button></div>
        </header>
        <main id="view" class="flex-1 p-4 sm:p-8 max-w-[1600px] w-full mx-auto space-y-6"></main>
      </div>
    </div>`;
  renderHeaderThemeIcon(); loadPage();
}

async function login() {
  await run(async () => {
    const x = await api('login', { email: $('email').value.trim(), password:$('password').value });
    state.token = x.token; state.user = x.user; sessionStorage.setItem('ddms_token', x.token); toast('เข้าสู่ระบบสำเร็จ'); render();
  });
}
async function boot() { if (!state.token) return render(); await run(async () => { state.user = await api('getCurrentUser'); render(); }); if (!state.user) render(); }
function navigate(p) { state.page = p; state.offset = 0; state.filter = ''; state.statusFilter = ''; toggleMobileMenu(false); render(); }

const titles = { incoming: 'ทะเบียนหนังสือรับ', outgoing: 'ทะเบียนหนังสือส่ง', workflow: 'คิวงานเสนอ/สั่งการ', folders: 'ทะเบียนแฟ้ม', search: 'ค้นหาเอกสาร' };
const status = ['รอดำเนินการ','กำลังดำเนินการ','รอเสนอ','รอสั่งการ','มอบหมายแล้ว','รอลงนาม','ส่งแล้ว','เสร็จสิ้น','เกินกำหนด','ยกเลิก','จัดเก็บถาวร'];
const option = (values, val='') => values.map(v => `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(v)}</option>`).join('');

function openModal(title, body) { $('modalTitle').textContent = title; $('modalBody').innerHTML = body; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }

async function loadPage() {
  const v = $('view'); if (!v) return;
  v.innerHTML = `<div class="glass-panel p-12 text-center text-xs font-medium text-slate-500">กำลังโหลดข้อมูล...</div>`;
  await run(async () => {
    if (state.page === 'dashboard') {
      const d = await api('getDashboard'); state.dashboard = d;
      v.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          ${Object.entries(d.counts).map(([k,n]) => `<div class="glass-panel rounded-2xl p-5"><div class="text-xs font-semibold text-slate-500">${esc(k)}</div><div class="text-3xl font-extrabold mt-2">${n}</div></div>`).join('')}
        </div>
        <div class="glass-panel rounded-2xl p-6">
          <h3 class="text-base font-bold mb-4">สัดส่วนตามสถานะ</h3>
          <div class="space-y-2">${Object.entries(d.statuses).map(([k,n])=>`<div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-800"><span class="badge" data-status="${esc(k)}">${esc(k)}</span><span class="text-sm font-bold">${n}</span></div>`).join('')}</div>
        </div>`;
      return;
    }
    if (state.page === 'settings') { await settingsPage(); return; }
    if (state.page === 'editor') { editorPage(); return; }
    if (state.page === 'reports') { await reportsPage(); return; }
    await listPage();
  });
}

async function listPage() {
  const p = state.page; let rows;
  if (p === 'incoming') rows = await api('getIncomingBooks');
  else if (p === 'outgoing') rows = await api('getOutgoingBooks');
  else if (p === 'workflow') rows = await api('getWorkflowQueue');
  else if (p === 'folders') rows = await api('getFolders');
  else rows = await api('searchDocuments',{});
  state.rows = rows || []; drawTable();
}

function drawTable() {
  const p = state.page, kw = state.filter.toLowerCase(), st = state.statusFilter;
  const rows = state.rows.filter(r => (!kw || Object.values(r).some(v => String(v??'').toLowerCase().includes(kw))) && (!st || r.Status === st));
  rows.sort((a,b) => String(a[state.sort]??'').localeCompare(String(b[state.sort]??''),'th',{numeric:true})*(state.desc?-1:1));
  const page = rows.slice(state.offset, state.offset+state.limit);
  const cols = p==='folders'?['Name','Year','Department','Category','Type']:['RegisterNo','BookNo','Subject','FromDepartment','ToDepartment','Responsible','Deadline','Status'];

  $('view').innerHTML = `
    <div class="flex flex-col sm:flex-row justify-between gap-4">
      <h1 class="text-2xl font-bold">${titles[p]||'รายการ'} (${rows.length})</h1>
      <div class="flex gap-2">
        ${['incoming','outgoing','folders'].includes(p)?`<button onclick="formRecord()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold">+ เพิ่มรายการ</button>`:''}
        <button onclick="window.print()" class="px-3.5 py-2 bg-white dark:bg-slate-800 border rounded-xl text-xs font-semibold">🖨️ พิมพ์</button>
      </div>
    </div>
    <div class="glass-panel rounded-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex gap-3">
        <input placeholder="ค้นหา..." value="${esc(state.filter)}" oninput="state.filter=this.value;state.offset=0;drawTable()" class="flex-1 px-4 py-2 rounded-xl border text-xs bg-white dark:bg-slate-900">
        ${p!=='folders'?`<select onchange="state.statusFilter=this.value;state.offset=0;drawTable()" class="py-2 px-3 rounded-xl border text-xs bg-white dark:bg-slate-900"><option value="">ทุกสถานะ</option>${option(status,state.statusFilter)}</select>`:''}
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead><tr class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${cols.map(c=>`<th class="py-3 px-4 font-semibold">${esc(tCol(c))}</th>`).join('')}<th class="py-3 px-4 text-right">จัดการ</th></tr></thead>
          <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
            ${page.map(r=>`<tr>${cols.map(c=>c==='Status'?`<td class="py-3 px-4"><span class="badge" data-status="${esc(r[c])}">${esc(r[c])}</span></td>`:`<td class="py-3 px-4 truncate max-w-xs">${esc(r[c]||'-')}</td>`).join('')}<td class="py-3 px-4 text-right space-x-1"><button onclick="viewRecord('${r.ID}')" class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800">ดู</button><button onclick="formRecord('${r.ID}')" class="px-2 py-1 rounded bg-blue-50 text-blue-600">แก้ไข</button></td></tr>`).join('')||'<tr><td colspan="10" class="py-8 text-center text-slate-400">ไม่พบข้อมูล</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

// ==================== EDITOR & TEMPLATES & E-SIGNATURE ====================
const DOC_TEMPLATES = {
  travel: { label: '🚗 ขออนุมัติไปราชการ', BookType: 'บันทึกข้อความ', Subject: 'ขออนุมัติเดินทางไปราชการเพื่อเข้าร่วมประชุมวิชาการ/อบรมสัมมนา', Salutation: 'คณบดีคณะศึกษาศาสตร์ (ผ่านหัวหน้าภาควิชาเทคโนโลยีและสื่อสารการศึกษา)', ToDepartment: 'สำนักงานเลขานุการคณะศึกษาศาสตร์', Enclosures: '๑. โครงการหรือกำหนดการประชุม จำนวน ๑ ชุด\n๒. ประมาณการค่าใช้จ่าย จำนวน ๑ ฉบับ', Body: 'ด้วย ข้าพเจ้า {USER_NAME} สังกัดภาควิชาเทคโนโลยีและสื่อสารการศึกษา มีความประสงค์ขออนุมัติเดินทางไปราชการเพื่อเข้าร่วมโครงการประชุมวิชาการ เรื่อง "........................................................" ณ ........................................................ ในระหว่างวันที่ ...... - ...... เดือน ................ พ.ศ. ๒๕๖๙\nจึงเรียนมาเพื่อโปรดพิจารณาอนุมัติ' },

function handleSignatureUpload(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    localStorage.setItem('ddms_user_signature', e.target.result);
    const p = $('sigPreview'); if (p) p.innerHTML = `<img src="${e.target.result}" class="h-10 object-contain mx-auto">`;
    toast('บันทึกลายเซ็นเรียบร้อยแล้ว');
  };
  reader.readAsDataURL(file);
}

function convertEditorDigits(toThai=true) {
  const form = $('editorForm'); if (!form) return;
  ['BookNo','FromDepartment','Subject','Salutation','ToDepartment','Enclosures','Body','Notes'].forEach(n => {
    if (form.elements[n] && form.elements[n].value) {
      form.elements[n].value = toThai ? toThaiDigits(form.elements[n].value) : toArabicDigits(form.elements[n].value);
    }
  });
  if ($('useThaiDigits'))$('useThaiDigits').checked = toThai;
  toast(toThai ? 'แปลงเป็นเลขไทย (๐-๙) แล้ว' : 'แปลงเป็นอารบิกแล้ว');
}

function applyDocTemplate(key) {
  const tpl = DOC_TEMPLATES[key], form = $('editorForm'); if (!tpl || !form) return;
  const useThai = $('useThaiDigits')?.checked ?? true;
  const fmt = v => useThai ? toThaiDigits(v) : v;
  form.elements.BookType.value = tpl.BookType;
  form.elements.Subject.value = fmt(tpl.Subject);
  form.elements.Salutation.value = fmt(tpl.Salutation);
  form.elements.ToDepartment.value = fmt(tpl.ToDepartment);
  form.elements.Enclosures.value = fmt(tpl.Enclosures);
  form.elements.Body.value = fmt(tpl.Body.replace(/\{USER_NAME\}/g, state.user?.Name || 'อาจารย์'));
  if (state.user?.Name) {
    if (!form.elements.Signatory.value) form.elements.Signatory.value = state.user.Name;
    if (!form.elements.PreparedBy.value) form.elements.PreparedBy.value = state.user.Name;
  }
  toast(`โหลดเทมเพลต "${tpl.label}" แล้ว`);
}

function formatThaiDateGov(dateStr, useThai=true) {
  if (!dateStr) return '................................................';
  const d = new Date(dateStr); if (isNaN(d.getTime())) return dateStr;
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const res = `${d.getDate()}  ${months[d.getMonth()]}  พ.ศ. ${d.getFullYear()+543}`;
  return useThai ? toThaiDigits(res) : res;
}

function field([k, label, type], r) {
  let input;
  if (type === 'textarea') input = `<textarea name="${k}">${esc(r[k])}</textarea>`;
  else input = `<input name="${k}" type="${type||'text'}" value="${esc(r[k])}">`;
  return `<label class="block ${type==='textarea'?'sm:col-span-2':''}"><span class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1 block">${esc(label)}</span>${input}</label>`;
}

function previewEditor() {
  const d = Object.fromEntries(new FormData($('editorForm')).entries());
  openModal('ตัวอย่างกระดาษ A4', `<div class="bg-slate-200 p-4 rounded overflow-x-auto"><div id="preview">${buildOfficialGovHtml(d)}</div></div><div class="flex justify-end pt-3"><button onclick="printModal()" class="px-4 py-2 bg-blue-600 text-white rounded text-xs font-semibold">🖨️ สั่งพิมพ์</button></div>`);
}

async function createDocument(e) {
  e.preventDefault();
  await run(async () => {
    const d = Object.fromEntries(new FormData(e.target).entries());
    const useThai = $('useThaiDigits')?.checked ?? true;
    if (useThai) { ['BookNo','FromDepartment','Subject','Salutation','ToDepartment','Enclosures','Body','Notes'].forEach(k => { if(d[k]) d[k]=toThaiDigits(d[k]); }); }
    d.SignatureImage = localStorage.getItem('ddms_user_signature') || '';
    const r = await api('saveOutgoingBook', d);
    await api('createDocumentPdf', { id: r.ID, useThaiDigits: useThai, signatureImage: d.SignatureImage });
    toast('สร้างเอกสารและ PDF สำเร็จ'); navigate('outgoing');
  });
}

async function viewRecord(id) {
  await run(async () => {
    const r = await api('getDocument', { id });
    openModal('รายละเอียดเอกสาร', `<div class="space-y-4"><div class="grid grid-cols-2 gap-2">${Object.entries(r.document).map(([k,v])=>`<div class="p-3 bg-slate-50 dark:bg-slate-800 rounded"><div class="text-[10px] text-slate-400">${tCol(k)}</div><div class="text-xs font-medium">${esc(v||'-')}</div></div>`).join('')}</div></div>`);
  });
}

function printModal() {
  const w = window.open('', '_blank'); if (!w) return;
  w.document.write(`<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet"></head><body style="margin:0">${$('preview').innerHTML}</body></html>`);
  w.document.close(); setTimeout(() => w.print(), 300);
}

boot();
